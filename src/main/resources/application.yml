server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: rumi-iam-service
  web:
    # Error messages are always in English, whatever the locale of the server or the client.
    locale: en
    locale-resolver: fixed
  datasource:
    url: ${IAM_DB_URL:jdbc:postgresql://localhost:5432/iamdb}
    username: ${IAM_DB_USERNAME:postgres}
    password: ${IAM_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Instants are stored in UTC as plain TIMESTAMP columns.
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

rumi:
  security:
    jwt:
      # HS256 key shared with rumi-api-gateway. Required, at least 32 bytes; there is no default on purpose.
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:PT1H}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
