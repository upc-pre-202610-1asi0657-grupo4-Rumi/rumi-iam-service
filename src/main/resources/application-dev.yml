# Development profile: runs with no external infrastructure.
# The schema is created in an in-memory H2 database on startup and dropped on shutdown.
spring:
  datasource:
    url: jdbc:h2:mem:iamdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        # No RabbitMQ in dev: the BuildingRegistered listener is not started. DevDataSeeder links the demo users.
        auto-startup: false
