# Test profile. The datasource is the PostgreSQL container of PostgresTestContainer (@ServiceConnection);
# the schema comes from docs/schema.sql and Hibernate only validates it (ddl-auto=validate, from application.yml).
spring:
  rabbitmq:
    listener:
      simple:
        # Hermetic tests: no broker unless a test starts its own RabbitMQ container and turns the listener on.
        auto-startup: false

rumi:
  security:
    jwt:
      # Test-only key. Fake on purpose: never use it outside the tests.
      secret: test-only-secret-not-for-production-32b!
